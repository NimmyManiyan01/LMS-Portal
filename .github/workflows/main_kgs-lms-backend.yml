
name: Build and deploy KGS LMS Backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Verify backend structure
        run: |
          ls -la
          ls -la backend
          test -f backend/package.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm install

      - name: Build backend if required
        working-directory: ./backend
        run: npm run build --if-present

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_53DFEDBA5715485F8FCE18436421C687 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C7E074F67A144379B7C6A6C17DD0773E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5471D21D0A8549F59DC322A9E4D39E91 }}

      - name: Deploy backend to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: kgs-lms-backend
          slot-name: Production
          package: .
