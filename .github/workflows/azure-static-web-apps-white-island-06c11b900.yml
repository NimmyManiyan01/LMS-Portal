
name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    permissions:
      id-token: write
      contents: read

    steps:
      # Step 1: Checkout repository with Git LFS support
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          persist-credentials: true

      # Step 2: Download actual image and video files
      - name: Download Git LFS Assets
        run: |
          git lfs install
          git lfs pull

      # Step 3: Verify media files
      - name: Verify Media Assets
        run: |
          echo "Checking frontend media assets..."

          find frontend -type f \( \
            -iname "*.png" -o \
            -iname "*.jpg" -o \
            -iname "*.jpeg" -o \
            -iname "*.webp" -o \
            -iname "*.mp4" \
          \) -exec ls -lh {} \;

          echo "Checking for unresolved Git LFS pointers..."

          if grep -rIl \
            --include="*.png" \
            --include="*.jpg" \
            --include="*.jpeg" \
            --include="*.webp" \
            --include="*.mp4" \
            "version https://git-lfs.github.com/spec/v1" \
            frontend; then
            echo "ERROR: Some media files are still Git LFS pointers."
            exit 1
          fi

          echo "Media verification completed."

      # Step 4: Obtain GitHub OIDC token
      - name: Get ID Token
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: |
            const core = require('@actions/core');
            return await core.getIDToken();
          result-encoding: string

      # Step 5: Build and deploy frontend to Azure
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_ISLAND_06C11B900 }}
          action: "upload"

          app_location: "./frontend"
          api_location: ""
          output_location: "build"

          github_id_token: ${{ steps.idtoken.outputs.result }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job

    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
